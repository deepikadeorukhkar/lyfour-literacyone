<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Word Family 'i' Game</title>
<link href="https://fonts.cdnfonts.com/css/kg-neatly-printed" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'KG Neatly Printed','Comic Sans MS',sans-serif}
:root{--img:min(30vw,220px);--btn:min(18vw,110px)}
body{height:100dvh;background:linear-gradient(#dff7ff,#fff5fb);overflow:hidden;touch-action:manipulation}
#intro,#game{position:fixed;inset:0}
#intro{display:flex;align-items:center;justify-content:center;background:#fff;z-index:5}
#intro img{width:min(70vw,320px)}
#game{display:none;flex-direction:column}
#top{background:#ffb6d9;padding:10px;text-align:center}
#title{font-size:clamp(26px,4vw,36px);color:#ff4081}
#content{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;align-items:center}
#questionArea{width:100%;display:flex;flex-direction:column;align-items:center}
#questionImage{width:var(--img);height:var(--img);object-fit:contain;background:#fff;border-radius:20px;padding:10px}
#options,#letters{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:16px}
.optionBtn,.letterBtn,#restartBtn,#speakBtn{border:none;border-radius:16px;cursor:pointer}
.optionBtn{padding:12px 20px;font-size:clamp(20px,3vw,30px)}
.imageOption{width:var(--btn);height:var(--btn);object-fit:contain;background:#fff;border-radius:16px;padding:8px}
#wordDisplay{font-size:clamp(34px,7vw,60px);margin:12px}
#letterBoxes{display:flex;gap:10px;margin-top:15px}
.letterBox,.letterBtn{width:min(15vw,70px);height:min(15vw,70px);display:flex;align-items:center;justify-content:center;font-size:clamp(24px,5vw,38px)}
.letterBox{border:3px dashed #666;background:#fff;border-radius:12px}
.letterBtn{background:#81d4fa}
#feedback{font-size:64px;height:80px}
#speakBtn{padding:8px 14px;background:#ffd54f;font-size:24px;margin-top:8px}
#gameOver{display:none;text-align:center}
@keyframes bounce{50%{transform:translateY(-10px)}}
#gameOver h1{animation:bounce 1s infinite}
</style>
</head>
<body>
<div id="intro"><img src="https://raw.githubusercontent.com/deepikadeorukhkar/lyfour-literacyone/main/word-family-i/assets/innovine-logo.png"></div>
<div id="game">
<div id="top"><div id="title">Word Family 'i'</div><div id="instruction"></div></div>
<div id="content"><div id="questionArea"></div><div id="feedback"></div>
<div id="gameOver"><h1>👏 Great Job! 👏</h1><button id="restartBtn">Play Again</button></div></div>
</div>

<audio id="correct" src="https://raw.githubusercontent.com/deepikadeorukhkar/lyfour-literacyone/main/word-family-i/assets/correct.mp3"></audio>
<audio id="wrong" src="https://raw.githubusercontent.com/deepikadeorukhkar/lyfour-literacyone/main/word-family-i/assets/wrong.mp3"></audio>
<audio id="bg" loop src="https://raw.githubusercontent.com/deepikadeorukhkar/lyfour-literacyone/main/word-family-i/assets/background-music.mp3"></audio>

<script>
const area=q('questionArea'),ins=q('instruction'),fb=q('feedback');
const correct=q('correct'),wrong=q('wrong');
function q(x){return document.getElementById(x)}
document.addEventListener('pointerdown',()=>q('bg').play().catch(()=>{}),{once:true});
function speak(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=.85;speechSynthesis.speak(u)}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
setTimeout(()=>{q('intro').style.display='none';q('game').style.display='flex';start1()},3000);

const g1=[{image:'rib',correct:'rib',options:['nib','rib','bib']},{image:'nib',correct:'nib',options:['nib','rib','bib']},{image:'bib',correct:'bib',options:['nib','rib','bib']}];
let i1=0;

function good(){fb.textContent='👏';correct.play();setTimeout(()=>fb.textContent='',800)}
function bad(){fb.textContent='❌';wrong.play();speak('Try again');setTimeout(()=>fb.textContent='',800)}

function start1(){i1=0;ins.textContent='Game 1: Look at the picture and choose the correct word.';load1()}
function load1(){
 if(i1>=g1.length)return start2();
 let x=g1[i1];
 area.innerHTML=`<img id="questionImage" src="https://raw.githubusercontent.com/deepikadeorukhkar/lyfour-literacyone/main/word-family-i/assets/${x.image}.png"><button id="speakBtn">🔊</button><div id="options"></div>`;
 q('speakBtn').onclick=()=>speak(x.correct);
 let o=document.getElementById('options');
 shuffle([...x.options]).forEach(w=>{let b=document.createElement('button');b.className='optionBtn';b.textContent=w;b.onclick=()=>w===x.correct?(good(),i1++,setTimeout(load1,900)):bad();o.appendChild(b)})
}

const words=['kit','lit','sit','hit','fit']; let q2=[];
function start2(){ins.textContent='Game 2: Look at the word and choose the correct picture.';q2=shuffle([...words]);load2()}
function load2(){
 if(!q2.length)return start3();
 let w=q2[0];
 area.innerHTML=`<div id="wordDisplay">${w}</div><button id="speakBtn">🔊</button><div id="options"></div>`;
 q('speakBtn').onclick=()=>speak(w);
 let o=document.getElementById('options');
 shuffle([...words]).forEach(n=>{let im=document.createElement('img');im.className='imageOption';im.src=`https://raw.githubusercontent.com/deepikadeorukhkar/lyfour-literacyone/main/word-family-i/assets/${n}.png`;im.onclick=()=>n===w?(good(),q2.shift(),setTimeout(load2,900)):bad();o.appendChild(im)})
}

const g3=[{image:'fig',answer:'fig',letters:['n','i','b','g','f','t']},{image:'pig',answer:'pig',letters:['f','i','t','g','f','p']},{image:'wig',answer:'wig',letters:['i','g','f','n','w','d']},{image:'dig',answer:'dig',letters:['p','i','d','w','f','g']}];
let i3=0,cur='';
function start3(){ins.textContent='Game 3: Complete the word using correct letters.';i3=0;load3()}
function load3(){
 if(i3>=g3.length)return finish();
 let x=g3[i3]; cur='';
 area.innerHTML=`<img id="questionImage" src="https://raw.githubusercontent.com/deepikadeorukhkar/lyfour-literacyone/main/word-family-i/assets/${x.image}.png"><button id="speakBtn">🔊</button><div id="letterBoxes"><div class="letterBox"></div><div class="letterBox"></div><div class="letterBox"></div></div><div id="letters"></div>`;
 q('speakBtn').onclick=()=>speak(x.answer);
 let l=document.getElementById('letters');
 shuffle([...x.letters]).forEach(ch=>{let b=document.createElement('button');b.className='letterBtn';b.textContent=ch;b.onclick=()=>{if(ch===x.answer[cur.length]){cur+=ch;document.querySelectorAll('.letterBox')[cur.length-1].textContent=ch;b.disabled=true;if(cur===x.answer){good();i3++;setTimeout(load3,900)}}else bad()};l.appendChild(b)})
}
function finish(){area.innerHTML='';ins.textContent='Wonderful! You completed all the games.';q('gameOver').style.display='block';speak('Great job!')}
q('restartBtn').onclick=()=>{q('gameOver').style.display='none';start1()}
</script>
</body>
</html>
